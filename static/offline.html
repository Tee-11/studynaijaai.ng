<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>You're offline - StudyNaija</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f4f7fb;color:#111827;font-family:Arial,sans-serif;text-align:center}
    main{max-width:440px;background:#fff;padding:32px;border-radius:18px;box-shadow:0 8px 30px #11182712}
    h1{color:#2563eb}
    p{line-height:1.6}
    button{border:0;border-radius:9px;background:#2563eb;color:#fff;padding:12px 20px;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>StudyNaija cannot connect right now. Please check your internet connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
