{% extends "base.html" %}

{% block title %}
{{ note.title }}
{% endblock %}


{% block content %}

<article class="wide-card">

    <span class="pill">
        {{ note.subject }}
        ·
        {{ note.class_level }}
    </span>


    <h1>
        {{ note.title }}
    </h1>


    <div class="note-content">

        {{ note.content
           | replace('\n', '<br>')
           | safe }}

    </div>


    <a
        class="button secondary"
        href="{{ url_for('notes') }}"
    >
        Back to Notes
    </a>

</article>

{% endblock %}
